name: Deploy MACH24 website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare public website
        shell: bash
        run: |
          mkdir -p _site/assets/figures
          cp index.html styles.css app.js data_catalog.json _site/
          cp assets/mach24-logo.svg assets/mach24-research-emblem.png _site/assets/
          cp assets/MACH24_IJE_*.pdf assets/aggregate_source_data.zip _site/assets/
          cp assets/figures/figure1_cohort_assembly.* assets/figures/figure2_detection_and_age.* assets/figures/figure3_gene_landscape.* _site/assets/figures/
          cp assets/figures/suppfigure* _site/assets/figures/
          cp -R assets/source_data _site/assets/
          touch _site/.nojekyll

      - name: Upload public website only
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
